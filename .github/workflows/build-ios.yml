name: Build unsigned iOS app

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project ESP32ControlCenter.xcodeproj \
            -scheme ESP32ControlCenter \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Find app
        run: |
          APP="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP"
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Package IPA
        run: |
          mkdir -p output/Payload
          cp -R "$APP" output/Payload/
          cd output
          zip -qry ESP32ControlCenter-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ESP32ControlCenter-iOS-unsigned
          path: output/ESP32ControlCenter-unsigned.ipa

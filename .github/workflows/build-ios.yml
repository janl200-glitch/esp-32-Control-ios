name: Build unsigned iOS app

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Xcode project
        run: |
          echo "Repository:"
          pwd
          echo "Files:"
          find . -maxdepth 4 -type f | sort

          PROJECT=$(find . -name "*.xcodeproj" -type d | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Kein .xcodeproj gefunden!"
            exit 1
          fi

          echo "Gefunden: $PROJECT"

          PROJECT_DIR=$(dirname "$PROJECT")
          PROJECT_NAME=$(basename "$PROJECT")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "PROJECT_NAME=$PROJECT_NAME" >> "$GITHUB_ENV"

      - name: Build iOS app
        run: |
          cd "$PROJECT_DIR"

          xcodebuild \
            -project "$PROJECT_NAME" \
            -scheme ESP32ControlCenter \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Find built app
        run: |
          APP=$(find "$PROJECT_DIR/build" -type d -name "*.app" | head -n 1)

          if [ -z "$APP" ]; then
            echo "ERROR: Keine .app gefunden!"
            exit 1
          fi

          echo "APP gefunden: $APP"
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Create IPA
        run: |
          mkdir -p output/Payload
          cp -R "$APP" output/Payload/ESP32ControlCenter.app

          cd output
          zip -qry ESP32ControlCenter-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ESP32ControlCenter-iOS-unsigned
          path: output/ESP32ControlCenter-unsigned.ipa
